<!doctype html>
<meta charset="utf-8">
<title>OW-MOODS perf</title>
<style>html,body{margin:0;background:#221507}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Times the REAL src/art/moods.js applyMood() on a canvas built exactly the
// way src/art/index.js makeCanvas() builds the room's mood layer, at the size
// the lock room uses at 1280x800. Served straight from source by
// scripts/serve.mjs, so no product debug hook is needed.
import { applyMood } from '/src/art/moods.js';

const W = 1280, H = 800;
const c = document.getElementById('c');
const d = Math.max(1, Math.min(devicePixelRatio || 1, 3));
c.width = Math.round(W * d);
c.height = Math.round(H * d);
c.style.width = W + 'px';
c.style.height = H + 'px';
const ctx = c.getContext('2d');
ctx.scale(d, d);

const frame = (g, t) => { ctx.clearRect(0, 0, W, H); applyMood(ctx, W, H, g, t, false); };

window.__moodPerf = (N = 400) => {
  const out = [];
  for (let g = 1; g <= 5; g++) {
    frame(g, 0);                       // warm the field cache
    for (let i = 0; i < 20; i++) frame(g, i * 33);
    const t0 = performance.now();
    for (let i = 0; i < N; i++) frame(g, i * 33);
    const t1 = performance.now();
    // clear-only baseline so the reported cost is the mood pass itself
    const t2 = performance.now();
    for (let i = 0; i < N; i++) ctx.clearRect(0, 0, W, H);
    const t3 = performance.now();
    out.push({ g, ms: (t1 - t0) / N, clearMs: (t3 - t2) / N });
  }
  return { dpr: d, out };
};
// probe(g, x, y) -> the mood layer's own rgba at a CSS point, for locating
// which pass is responsible for a bright spot
window.__moodProbe = (g, x, y, t = 0) => {
  frame(g, t);
  const px = cx => cx;
  const dd = ctx.getImageData(Math.round(x * d), Math.round(y * d), 1, 1).data;
  return [dd[0], dd[1], dd[2], dd[3]];
};
window.__moodStrip = (g, y, t = 0) => {
  frame(g, t);
  const row = [];
  for (let x = 0; x < W; x += 20) {
    const dd = ctx.getImageData(Math.round(x * d), Math.round(y * d), 1, 1).data;
    row.push([x, dd[3]]);
  }
  return row;
};
window.__moodReady = true;
</script>
